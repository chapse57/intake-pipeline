[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    offline: runs the real n8n JavaScript through node; no credentials needed
    integration: posts at a live n8n and reads Notion; skipped without env
    warehouse: migrations, loader and role isolation against a real PostgreSQL; skipped without WAREHOUSE_*_DSN
    T1: duplicate email, different case
    T2: duplicate phone, different format
    T3: similar name on the same domain routes to Review
    T4: brand new candidate is created and attributed
    T5: role outside the allowed set is rejected
    T6: evidence quote absent from the source is rejected
    T7: low confidence routes to Review
    T8: approved candidate gets the role-specific DocuSign template
    T9: replayed completion webhook creates exactly one Xero contact
    T10: Xero 5xx retries then alerts
    T11: re-submission by a second recruiter does not steal attribution
    T12: batch of 20 with 6 planted duplicates
